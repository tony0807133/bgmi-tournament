<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" fill="none">
  <defs>
    <linearGradient id="sg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Shield icon -->
  <path d="M32 6 L54 15 L54 36 C54 50 44 59 32 63 C20 59 10 50 10 36 L10 15 Z"
        fill="#0f0f17" stroke="url(#sg)" stroke-width="2"/>

  <!-- Crosshair circle -->
  <circle cx="32" cy="34" r="10" fill="none" stroke="url(#sg)" stroke-width="1.8" filter="url(#glow)"/>
  <circle cx="32" cy="34" r="2" fill="url(#sg)" filter="url(#glow)"/>

  <!-- Crosshair lines -->
  <line x1="32" y1="20" x2="32" y2="27" stroke="url(#sg)" stroke-width="1.8" stroke-linecap="round" filter="url(#glow)"/>
  <line x1="32" y1="41" x2="32" y2="48" stroke="url(#sg)" stroke-width="1.8" stroke-linecap="round" filter="url(#glow)"/>
  <line x1="18" y1="34" x2="25" y2="34" stroke="url(#sg)" stroke-width="1.8" stroke-linecap="round" filter="url(#glow)"/>
  <line x1="39" y1="34" x2="46" y2="34" stroke="url(#sg)" stroke-width="1.8" stroke-linecap="round" filter="url(#glow)"/>

  <!-- BGMI text -->
  <text x="68" y="30" font-family="'Arial Black', Arial, sans-serif" font-weight="900" font-size="22" fill="#f97316" letter-spacing="1">BGMI</text>

  <!-- ARENA text -->
  <text x="69" y="52" font-family="'Arial Black', Arial, sans-serif" font-weight="900" font-size="18" fill="#ffffff" letter-spacing="4">ARENA</text>

  <!-- Accent underline -->
  <line x1="68" y1="57" x2="200" y2="57" stroke="url(#sg)" stroke-width="1.5" stroke-opacity="0.4" stroke-linecap="round"/>
</svg>
