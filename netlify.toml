[build]
  base    = "bgmi-tournament/frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  VITE_API_URL = "https://bgmi-backend-2cnu.onrender.com"

[[redirects]]
  from    = "/api/*"
  to      = "https://bgmi-backend-2cnu.onrender.com/api/:splat"
  status  = 200
  force   = true

[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
